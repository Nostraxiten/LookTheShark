[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lookingtheshark"
version = "2.0.0"
description = "Traductor forense de capturas de red: convierte un .pcap en una explicacion de que paso"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "nostraxiten" }]
keywords = ["pcap", "forensics", "network", "security", "dfir", "wireshark"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]

# Solo Python puro: se instala como wheel en cualquier sistema sin compilador.
dependencies = [
    "rich>=13.7.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
geo = ["geoip2>=4.8.0"]
compresion = ["brotli>=1.1.0", "zstandard>=0.22.0"]
todo = ["geoip2>=4.8.0", "brotli>=1.1.0", "zstandard>=0.22.0"]

[project.scripts]
lookingtheshark = "lookingtheshark:main"
lts = "lookingtheshark:main"

[project.urls]
Repositorio = "https://github.com/Nostraxiten/LookTheShark"
Incidencias = "https://github.com/Nostraxiten/LookTheShark/issues"

[tool.setuptools]
py-modules = ["lookingtheshark"]

[tool.setuptools.packages.find]
include = ["core*", "modules*", "ui*"]

[tool.setuptools.package-data]
"*" = ["data/*.json", "templates/*.j2"]
